name: CI and image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  image:
    name: Build and verify image
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build Linux amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            VITE_API_BASE=${{ vars.VITE_API_BASE }}
            VITE_WS_EVENTS=${{ vars.VITE_WS_EVENTS }}
            VITE_FRAME_API_BASE=${{ vars.VITE_FRAME_API_BASE }}
            VITE_WS_BASE=${{ vars.VITE_WS_BASE }}
          load: true
          push: false
          tags: itmo-ci:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish to GHCR
    needs: [checks, image]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'ITMO-Monitoring-System/frontend'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish checked revision
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            VITE_API_BASE=${{ vars.VITE_API_BASE }}
            VITE_WS_EVENTS=${{ vars.VITE_WS_EVENTS }}
            VITE_FRAME_API_BASE=${{ vars.VITE_FRAME_API_BASE }}
            VITE_WS_BASE=${{ vars.VITE_WS_BASE }}
          push: true
          tags: ghcr.io/itmo-monitoring-system/frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
      - name: Record release reference
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf '### frontend image\n\n`ghcr.io/itmo-monitoring-system/frontend@%s`\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
