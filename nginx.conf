map $request_uri $log_path {
    default /other;
    /api/ws /api/ws;
    /tracking/health /tracking/health;
    /tracking/ws/stream /tracking/ws/stream;
    ~^/api/ /api/*;
    ~^/tracking/ /tracking/*;
}

log_format itmo_json escape=json '{"timestamp":"$time_iso8601","service":"frontend","event":"http_access","request_id":"$request_id","method":"$request_method","path":"$log_path","status":$status,"duration_seconds":$request_time,"upstream_status":"$upstream_status","upstream_duration":"$upstream_response_time"}';
error_log /dev/stderr warn;

server {
    access_log /dev/stdout itmo_json;
    listen 80;
    server_name _;
    # Resolve Compose service names again after containers receive new IPs.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    set $backend_upstream backend:8080;
    set $tracking_upstream face_tracking:8000;

    root /usr/share/nginx/html;
    index index.html;

    location /tracking/ {
        rewrite ^/tracking/(.*)$ /$1 break;
        proxy_pass http://$tracking_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ws {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Заголовки безопасности
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
